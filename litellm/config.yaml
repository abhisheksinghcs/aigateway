model_list:
  - model_name: customer-chat
    litellm_params:
      model: azure/o4-mini
      api_base: https://agent365-teams-agents.openai.azure.com/
      api_version: "2025-04-01-preview"
    model_info:
      base_model: azure/o4-mini

guardrails:
  - guardrail_name: agent365-mcp
    litellm_params:
      guardrail: agent_365
      mode: pre_mcp_call
      default_on: true
      tenant_id: os.environ/AGENT365_TENANT_ID
      client_id: os.environ/AGENT365_CLIENT_ID
      client_secret: os.environ/AGENT365_CLIENT_SECRET

mcp_servers:
  deepwiki:
    transport: http
    url: https://mcp.deepwiki.com/mcp

litellm_settings:
  enable_azure_ad_token_refresh: true
  drop_params: true

general_settings:
  master_key: os.environ/PROXY_MASTER_KEY
  disable_env_credential_login: true
  enable_jwt_auth: true
  use_x_forwarded_for: true
  mcp_trusted_proxy_ranges:
    - 10.244.0.0/16
  mcp_xff_num_trusted_hops: 1
  litellm_jwtauth:
    issuers:
      - issuer: https://sts.windows.net/e0ca6a1b-554d-4f12-87c9-92ec42abb750/
        jwks_url: https://login.microsoftonline.com/e0ca6a1b-554d-4f12-87c9-92ec42abb750/discovery/v2.0/keys
        audience: api://18f77e7f-8bf9-4f43-b014-e2168b6c5574
        team_id_jwt_field: appid
        user_id_jwt_field: oid
