apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-foundry-middleware
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm-foundry-middleware
    app.kubernetes.io/managed-by: containerization-assist
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-foundry-middleware
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-foundry-middleware
        app.kubernetes.io/managed-by: containerization-assist
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: litellm-foundry-middleware
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: middleware
          image: litellmdemokhtkwbank4rg6.azurecr.io/litellm-foundry-middleware@sha256:97384368e3da9c889b7a052f41b6cd684d8e6ebb25cc5e63a72f5fa144fbb91f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: litellm-foundry-middleware-config
            - secretRef:
                name: litellm-foundry-middleware-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
