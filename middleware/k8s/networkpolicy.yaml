apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-foundry-middleware
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm-foundry-middleware
    app.kubernetes.io/managed-by: containerization-assist
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm-foundry-middleware
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - ipBlock:
            cidr: 10.40.0.0/22
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
