[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "litellm-foundry-middleware"
version = "0.1.0"
description = "Trusted OBO middleware for invoking a Microsoft Foundry hosted agent."
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.11,<4",
  "azure-identity>=1.19,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "msal>=1.31,<2",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_middleware"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
